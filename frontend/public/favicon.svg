<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Reef">
  <defs>
    <radialGradient id="reef-coral" cx="30%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#f07050" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#f07050" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="reef-blue" cx="72%" cy="72%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0" />
    </radialGradient>
    <filter id="reef-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="32" height="32" rx="16" fill="#171410" />
  <circle cx="16" cy="16" r="14.5" fill="none" stroke="#f07050" stroke-opacity="0.32" />
  <circle cx="16" cy="16" r="14.5" fill="url(#reef-coral)" />
  <circle cx="16" cy="16" r="14.5" fill="url(#reef-blue)" />
  <circle cx="16" cy="16" r="14.5" fill="#f07050" fill-opacity="0.12" />
  <circle cx="16" cy="16" r="3.5" fill="#f07050" filter="url(#reef-glow)" />
</svg>
